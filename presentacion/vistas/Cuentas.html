<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Cuentas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- storage primero -->
    <script src="../../acceso_datos/StorageCuentas.js"></script>

    <script src="../../modelos/Cuenta.js"></script>
    <script src="../../modelos/CuentaCorriente.js"></script>
    <script src="../../modelos/CuentaAhorros.js"></script>

    <!-- app -->
    <script src="../../negocio/ControladorCuentas.js"></script>

</head>

<body class="bg-light">

    <div class="container mt-5">
        <h2 class="mb-4">Gestión de Cuentas</h2>

        <!-- Formulario simple -->
        <div class="card mb-4">
            <div class="card-body">

                <div class="row g-3">

                    <div class="col-md-3">
                        <label class="form-label">Titular</label>
                        <input type="text" id="titular" class="form-control">
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Saldo</label>
                        <input type="number" id="saldo" class="form-control" value="0">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Tipo</label>
                        <select id="tipo" class="form-select">
                            <option value="ahorros">Ahorros</option>
                            <option value="corriente">Corriente</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label">Sobregiro</label>
                        <input type="number" id="sobregiro" class="form-control" value="0">
                    </div>

                    <div class="col-md-2 d-flex align-items-end">
                        <button id="btnCrear" class="btn btn-primary w-100">
                            Crear
                        </button>
                    </div>

                </div>

            </div>
        </div>

        <!-- Tabla -->
        <div class="card">
            <div class="card-body">
                <table class="table table-bordered table-striped">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Titular</th>
                            <th>Tipo</th>
                            <th>Saldo</th>
                            <th>Sobregiro</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyCuentas">
                        <!-- Aquí se cargan las cuentas -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>



</body>

</html>
